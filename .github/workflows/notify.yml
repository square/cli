# Announces each release's npm publish outcome. Posts to every webhook secret
# that is set; a missing secret is skipped, so the workflow is safe to land
# before the webhooks exist.
#
#   SLACK_RELEASE_WEBHOOK_URL  Slack Workflow Builder webhook for #square-cli-notifications
#   BUZZ_RELEASE_WEBHOOK_URL   optional second destination that accepts the same JSON
#
# The payload is public-safe (version, outcome, links), because this repo's
# Actions logs are public. Never echo the webhook URLs.
name: Notify release outcome

on:
  workflow_run:
    workflows: ['Publish to npm']
    types: [completed]

permissions: {}

jobs:
  notify:
    # Manual dispatches are dry runs or re-publishes of an announced release.
    if: github.event.workflow_run.event == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Post to webhooks
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          REPO_URL: ${{ github.event.repository.html_url }}
          SLACK_RELEASE_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_WEBHOOK_URL }}
          BUZZ_RELEASE_WEBHOOK_URL: ${{ secrets.BUZZ_RELEASE_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          release_url="$REPO_URL/releases/tag/$TAG"
          if [ "$CONCLUSION" = success ]; then
            status=success
            text=":white_check_mark: Square CLI $TAG is out on GitHub and npm: <$release_url|release notes>"
          else
            status=failure
            text=":x: Square CLI $TAG npm publish ended with \`$CONCLUSION\`. The GitHub release is up, npm may not be: <$RUN_URL|workflow run>"
          fi
          # Workflow Builder webhooks read the named fields; incoming webhooks read text.
          payload=$(jq -n --arg text "$text" --arg version "${TAG#v}" --arg status "$status" \
            --arg conclusion "$CONCLUSION" --arg release_url "$release_url" --arg run_url "$RUN_URL" \
            '$ARGS.named')
          posted=0
          for name in SLACK_RELEASE_WEBHOOK_URL BUZZ_RELEASE_WEBHOOK_URL; do
            url=${!name}
            if [ -z "$url" ]; then
              echo "$name is not set; skipping"
              continue
            fi
            curl -sS --fail-with-body --retry 3 -o /dev/null -H 'Content-Type: application/json' -d "$payload" "$url"
            echo "Posted to $name"
            posted=1
          done
          [ "$posted" = 1 ] || echo "::warning::No release webhook secret is set; nothing was posted."
