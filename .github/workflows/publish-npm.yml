# Publishes a square/cli release's binaries to npm: one @square/cli-<os>-<cpu>
# package per binary, then @square/cli, which installs the matching one.
# Authenticates with npm trusted publishing (OIDC); there is no npm token.
name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.3.0
        required: true
      dry_run:
        description: Check packaging and npm trusted publishing without publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  # gh release verify-asset reads release attestations; needed while the repo is private.
  attestations: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Add required reviewers to this environment to gate each publish.
    environment: npm-publish
    outputs:
      version: ${{ steps.publish.outputs.version }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # While the repo is private every run is a dry run, releases included, so
      # the first real publish is the first release after the repo goes public.
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) || github.event.repository.private }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1

      - name: Test packaging
        run: node --test npm/build-packages.test.mjs

      - name: Download and verify release assets
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern 'square-*' --pattern checksums.txt --pattern THIRD-PARTY-NOTICES.md
          for f in assets/*; do
            gh release verify-asset "$TAG" "$f" --repo "$GITHUB_REPOSITORY"
          done

      - name: Build packages
        run: node npm/build-packages.mjs "${TAG#v}" assets out > publish-order.txt

      - name: Publish
        id: publish
        run: |
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          dist_tag=latest
          case "$version" in *-*) dist_tag=next ;; esac
          if [ "$DRY_RUN" = true ]; then
            echo "::notice::Dry run: nothing will be published to npm."
          fi
          failed=0
          # fd 3, so npm can never read the remaining package list from stdin.
          while read -r dir <&3; do
            name=$(node -p "require('./$dir/package.json').name")
            if [ "$DRY_RUN" = true ]; then
              # npm exchanges the OIDC token even on --dry-run, but a failed exchange
              # is only logged, so check the log. --force skips the "already
              # published" check, which would otherwise stop a dry run of a past tag.
              npm publish "./$dir" --access public --tag "$dist_tag" --dry-run --force --loglevel verbose 2>&1 | tee publish.log
              if grep -q 'oidc Successfully retrieved and set token' publish.log; then
                echo "$name: trusted publishing OK"
              else
                echo "::error::$name: npm rejected the OIDC token; check its trusted publisher settings"
                failed=1
              fi
              continue
            fi
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "$name@$version is already on npm; skipping"
              continue
            fi
            npm publish "./$dir" --access public --tag "$dist_tag"
          done 3< publish-order.txt
          exit "$failed"

  # Tests what users get from a release: the public downloads and
  # `npm install -g @square/cli` on every platform.
  smoke:
    needs: publish
    if: github.event_name == 'release'
    # smoke.yml asks for contents: write, which it uses only for draft releases.
    permissions:
      contents: write
    uses: ./.github/workflows/smoke.yml
    with:
      version: ${{ needs.publish.outputs.version }}
      source: release

  # Announces a release's npm publish and smoke outcome through the Slack Workflow
  # Builder webhook in SLACK_RELEASE_WEBHOOK_URL. Without the secret it only warns. Actions logs here are public: the payload
  # carries only the version, outcome and links, and the webhook URL is never echoed.
  notify:
    needs: [publish, smoke]
    # Manual dispatches are dry runs or re-publishes of an announced release.
    if: always() && github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions: {}
    # The job holds the workflow's concurrency slot, so a stalled webhook must not
    # block the next publish.
    timeout-minutes: 3
    steps:
      - name: Post to Slack
        env:
          TAG: ${{ github.event.release.tag_name }}
          PUBLISH: ${{ needs.publish.result }}
          SMOKE: ${{ needs.smoke.result }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_RELEASE_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "$SLACK_RELEASE_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_RELEASE_WEBHOOK_URL is not set; nothing was posted."
            exit 0
          fi
          if [ "$PUBLISH" != success ]; then
            status=failure result=$PUBLISH
            text=":x: Square CLI $TAG npm publish ended with \`$PUBLISH\`. The GitHub release is up, npm may not be: <$RUN_URL|workflow run>"
          elif [ "$SMOKE" != success ]; then
            status=failure result=$SMOKE
            text=":x: Square CLI $TAG is on npm, but the install smoke ended with \`$SMOKE\`. Some users may not be able to install or run it: <$RUN_URL|workflow run>"
          else
            status=success result=success
            text=":white_check_mark: Square CLI $TAG is out on GitHub and npm and installs on every platform: <$RELEASE_URL|release notes>"
          fi
          # Workflow Builder webhooks read the named fields; incoming webhooks read text.
          payload=$(jq -n --arg text "$text" --arg version "${TAG#v}" --arg status "$status" \
            --arg conclusion "$result" --arg release_url "$RELEASE_URL" --arg run_url "$RUN_URL" \
            '$ARGS.named')
          curl -sS --fail-with-body --connect-timeout 10 --max-time 20 --retry 3 --retry-max-time 60 \
            -o /dev/null -H 'Content-Type: application/json' -d "$payload" "$SLACK_RELEASE_WEBHOOK_URL"
